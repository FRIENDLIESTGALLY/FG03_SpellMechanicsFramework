; Spell Mechanics Framework settings. Restart the game after changing anything here.

[General]
; 1 = only the player's spells are affected (recommended). 0 = NPC spells too (untested).
bPlayerOnly=1
; 1 = write every change to Documents\My Games\Skyrim Special Edition\SKSE\FG03_SpellMechanicsFramework.log
; Turn it on while you build and test perks; leave it off for normal play.
bDebugLog=0

[Limits]
; Lowest and highest multiplier any radius / range / cast-time category may produce.
fMinMult=0.1
fMaxMult=10.0
; Most extra projectiles one cast can add (on top of the original), and the angle between them.
iMaxExtraProjectiles=10
fExtraProjectileSpreadDegrees=6.0
; Highest value the MaxRunes category may set the rune limit to.
iMaxRunesCap=20

[Runes]
; How the rune limit is enforced.
; 0 = only change the game setting iMaxPlayerRunes.
; 1 = change it, and if the game is seen removing a rune below the limit, the framework takes over (recommended).
; 2 = the framework always tracks your runes and removes the oldest past the limit itself.
iRuneLimitMode=1
